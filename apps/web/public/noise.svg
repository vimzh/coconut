<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768">
  <filter id="mottling" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.003 0.004" numOctaves="3" seed="7" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.25 0 0 0 0 0.36 0 0 0 0 0.2 0 0 0 3 -1" />
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.48 0.72" numOctaves="3" seed="17" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="768" height="768" filter="url(#mottling)" opacity="0.25" />
  <rect width="768" height="768" filter="url(#grain)" opacity="0.85" />
</svg>
