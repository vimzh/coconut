<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" data-layout-version="cloudy-native-v2" data-spec-sha256="3237ee151da9fe84236bcc09536a60b652d32cb3969513547a12f2f87ceaaab9">
  <title id="title">Coconut today: from tasks to evidence</title>
  <desc id="description">An evaluator selects a fixed certified suite and provider/model using their own key, reviews three trials per task and approves charges. Independent provider requests receive expressions and domains without reference answers. Replies are scored and retained privately for seven days, then inspected, exported or explicitly published. Ranking requires separate eligibility checks. Interruptions preserve partial evidence without automatic resumption.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#57534e"/></marker>
    <style>
      text { font-family: "Comic Sans MS", "Segoe Print", cursive; }
      .title { font-size: 36px; fill: #292524; }
      .subtitle { font-size: 17px; fill: #78716c; }
      .zone-label { font-size: 14px; letter-spacing: 1px; }
      .node-title { font-size: 20px; fill: #292524; }
      .node-body { font-size: 15px; fill: #44403c; }
      .node-note { font-size: 13px; fill: #57534e; }
      .edge-label { font-size: 13px; fill: #57534e; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
      .footer { font-size: 13px; fill: #57534e; }
      .arrow { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fffdf8"/>
  <text x="54" y="62" class="title">Coconut today: from tasks to evidence</text>
  <text x="54" y="94" class="subtitle">The current three-trial product; Phase 15&#x27;s 800-task single-trial study is a separate planned workload.</text>
  <rect data-zone-id="setup" x="42.0" y="130" width="386.5" height="690" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="62.0" y="160" class="zone-label" fill="#1e40af">1 · CHOOSE AND APPROVE</text>
  <rect data-zone-id="execution" x="456.5" y="130" width="450.9" height="690" rx="28" fill="#f0fdfa" stroke="#5eead4" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="476.5" y="160" class="zone-label" fill="#115e59">2 · ASK AND GRADE</text>
  <rect data-zone-id="evidence" x="935.4" y="130" width="622.6" height="690" rx="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="955.4" y="160" class="zone-label" fill="#166534">3 · INSPECT AND SHARE</text>
  <path class="arrow" data-edge="choose--approve" d="M235.2 326.0 V490.0" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="arrow" data-edge="approve--model" d="M398.5 558.0 H442.5 V258.0 H486.5" stroke="#0f766e" marker-end="url(#arrow-teal)"/>
  <path class="arrow" data-edge="model--grade" d="M681.9 326.0 V490.0" stroke="#0f766e" marker-end="url(#arrow-teal)"/>
  <path class="arrow" data-edge="grade--report" d="M877.4 558.0 H921.4 V258.0 H965.4" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path class="arrow" data-edge="report--export" d="M1246.7 326.0 V351.0" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path class="arrow" data-edge="report--publish" d="M1528.0 258.0 H1542.0 V710.0 H1528.0" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <rect class="node" data-node-id="choose" data-status="implemented" x="72.0" y="190.0" width="326.5" height="136.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="235.2" y="225.0" text-anchor="middle" class="node-title">Choose the evaluation</text>
  <text x="235.2" y="256.0" text-anchor="middle" class="node-body">Fixed certified suite</text>
  <text x="235.2" y="278.0" text-anchor="middle" class="node-body">Provider, model and settings</text>
  <text x="235.2" y="308.0" text-anchor="middle" class="node-note">Your provider key stays in page memory.</text>
  <rect class="node" data-node-id="approve" data-status="implemented" x="72.0" y="490.0" width="326.5" height="136.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="235.2" y="525.0" text-anchor="middle" class="node-title">Approve the workload</text>
  <text x="235.2" y="556.0" text-anchor="middle" class="node-body">Task count × three fresh trials</text>
  <text x="235.2" y="578.0" text-anchor="middle" class="node-body">Review limits and provider charges</text>
  <text x="235.2" y="608.0" text-anchor="middle" class="node-note">Keep this page open during execution.</text>
  <rect class="node" data-node-id="model" data-status="external" x="486.5" y="190.0" width="390.9" height="136.0" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="681.9" y="225.0" text-anchor="middle" class="node-title">The provider answers</text>
  <text x="681.9" y="256.0" text-anchor="middle" class="node-body">Fresh independent requests</text>
  <text x="681.9" y="278.0" text-anchor="middle" class="node-body">Expression and exact interval</text>
  <text x="681.9" y="308.0" text-anchor="middle" class="node-note">Reference answers stay outside prompts.</text>
  <rect class="node" data-node-id="grade" data-status="implemented" x="486.5" y="490.0" width="390.9" height="136.0" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="681.9" y="525.0" text-anchor="middle" class="node-title">Score retained replies</text>
  <text x="681.9" y="556.0" text-anchor="middle" class="node-body">Labels compared with references</text>
  <text x="681.9" y="578.0" text-anchor="middle" class="node-body">Every outcome stays accounted for</text>
  <text x="681.9" y="608.0" text-anchor="middle" class="node-note">Model errors and service failures stay distinct.</text>
  <rect class="node" data-node-id="report" data-status="implemented" x="965.4" y="190.0" width="562.6" height="136.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1246.7" y="225.0" text-anchor="middle" class="node-title">Inspect your private report</text>
  <text x="1246.7" y="256.0" text-anchor="middle" class="node-body">Accuracy, macro-F1 and depth detail</text>
  <text x="1246.7" y="278.0" text-anchor="middle" class="node-body">Read each answer beside its reference</text>
  <text x="1246.7" y="308.0" text-anchor="middle" class="node-note">Seven-day retention; save the separate access code.</text>
  <rect class="node" data-node-id="export" data-status="implemented" x="965.4" y="351.0" width="562.6" height="114.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1246.7" y="386.0" text-anchor="middle" class="node-title">Export retained evidence</text>
  <text x="1246.7" y="417.0" text-anchor="middle" class="node-body">Download results, replies and settings</text>
  <text x="1246.7" y="447.0" text-anchor="middle" class="node-note">The export contains no provider key.</text>
  <rect class="node" data-node-id="publish" data-status="implemented" x="965.4" y="642.0" width="562.6" height="136.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1246.7" y="677.0" text-anchor="middle" class="node-title">Publish a complete run</text>
  <text x="1246.7" y="708.0" text-anchor="middle" class="node-body">Explicit public sharing; reversible</text>
  <text x="1246.7" y="730.0" text-anchor="middle" class="node-body">Eligible comparisons enter the leaderboard</text>
  <text x="1246.7" y="760.0" text-anchor="middle" class="node-note">Exploratory results remain unranked.</text>
  <rect x="54" y="844" width="1492" height="36" rx="14" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="800" y="868" text-anchor="middle" class="footer">Cancellation stops new work; remote charges can remain uncertain. Partial evidence stays inspectable; no automatic resume.</text>
</svg>
